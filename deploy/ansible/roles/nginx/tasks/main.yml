- name: Install nginx
  become: true
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Copy nginx config
  become: true
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/reviews.conf

- name: Enable nginx site
  become: true
  file:
    src: /etc/nginx/sites-available/reviews.conf
    dest: /etc/nginx/sites-enabled/reviews.conf
    state: link

- name: Remove default site
  become: true
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Restart nginx
  become: true
  service:
    name: nginx
    state: restarted